# Holt alle 3 Stunden die neuesten Instagram-Beitraege in die Startseite.
# Montags frueh wird zusaetzlich der Zugangsschluessel um 60 Tage verlaengert.
# Secrets: IG_TOKEN (Instagram), SECRETS_PAT (darf Secrets dieses Repos schreiben, fuer die Verlaengerung)
name: Instagram holen

on:
  schedule:
    - cron: '17 */3 * * *'
    - cron: '41 3 * * 1'
  workflow_dispatch:
    inputs:
      erneuern:
        description: 'Schluessel jetzt verlaengern'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency: instagram

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow tzdata

      - name: Beitraege holen
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ERNEUERN: ${{ (github.event.schedule == '41 3 * * 1' || inputs.erneuern) && '1' || '0' }}
        run: python .github/instagram.py

      - name: Neuen Schluessel speichern
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -f "$RUNNER_TEMP/ig_token" ]; then
            if [ -z "$GH_TOKEN" ]; then echo "::warning::SECRETS_PAT fehlt, Schluessel nicht gespeichert"; exit 0; fi
            gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/ig_token"
            rm -f "$RUNNER_TEMP/ig_token"
          fi

      - name: Einchecken und Seite neu bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add index.html assets/instagram
          if git diff --cached --quiet; then echo "Keine neuen Beitraege."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Instagram: neueste Beitraege"
          git push
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null || true
