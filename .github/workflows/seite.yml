# Baut die Seite fuer GitHub Pages und veroeffentlicht sie als Artefakt (Abnahme 07.10.2026, AB3-2).
# Instagram-Bilder und instagram-daten.js kommen NUR ins Artefakt, nie ins Repo: sonst bliebe ein auf
# Instagram geloeschter Beitrag (auch Kinderfotos) fuer immer im oeffentlichen Git-Verlauf.
# Im Repo liegt instagram-daten.js nur als leerer Platzhalter (keine Karten, auch per file://).
#
# Laeuft bei jedem Push auf main, alle 3 Stunden und per Hand. Ein geplanter Lauf veroeffentlicht nur,
# wenn sich die Instagram-Daten gegenueber live geaendert haben (sonst bleibt die Seite, wie sie ist).
# Montags frueh wird zusaetzlich der Instagram-Schluessel um 60 Tage verlaengert und der Zeitplan
# selbst aktiv gehalten (Job wach-halten, ohne Commit).
# Secrets: IG_TOKEN (Instagram Verein), IG_TOKEN_NACHWUCHS (Instagram Nachwuchs), SECRETS_PAT (darf Secrets
# dieses Repos schreiben, nur fuer die Verlaengerung alter "IG..."-Schluessel; Systemnutzer-Tokens laufen nie ab).
# Optional Repo-Variablen oder Secrets IG_ID / IG_ID_NACHWUCHS (Instagram-Konto-ID), falls das Skript sie nicht selbst findet.
# Pages-Quelle muss "GitHub Actions" sein (build_type workflow); steht sie auf einem Branch,
# baut der Lauf nur und veroeffentlicht nichts.
name: Seite bauen

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
    - cron: '41 3 * * 1'
  workflow_dispatch:
    inputs:
      erneuern:
        description: 'Instagram-Schluessel jetzt verlaengern'
        type: boolean
        default: false

permissions:
  contents: read

# Immer nur ein Lauf zur Zeit (Pages-Deploys duerfen nicht parallel laufen). queue: max
# (Bugjagd 08.10.2026b W3): sonst haelt GitHub je Gruppe nur EINEN wartenden Lauf, und ein
# geplanter Lauf verdraengte einen wartenden Push-Lauf -- der Push ging dann nicht live
# (der geplante veroeffentlicht nur bei neuen Instagram-Daten). Jetzt warten alle der Reihe nach.
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  # Bauen und Veroeffentlichen (Pages) in EINEM Job: jeder Job wird auf eine volle Minute aufgerundet
  # (16.11.2026). Die Hetzner-Kopie laeuft dagegen bewusst getrennt (Job "hetzner", ohne Repo-Code).
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      veroeffentlichen: ${{ steps.entscheiden.outputs.veroeffentlichen }}
      instagram: ${{ steps.instagram.outcome }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Seite zusammenstellen
        # Genau die Dateien aus main, wie bisher beim Bau aus dem Branch -- ohne .github.
        run: |
          mkdir _site
          git ls-files -z | grep -zv '^\.github/' | xargs -0 cp --parents -t _site
          echo "$(find _site -type f | wc -l) Dateien"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      # Feste Versionen (Abnahme 08.10.2026 AB3-7): Dieser Job hat spaeter IG_TOKEN/SECRETS_PAT in der
      # Umgebung, ein neu veroeffentlichtes Paket soll hier nicht ungeprueft mitlaufen. Bei Bedarf von Hand
      # anheben (nur Versionen, die mindestens zwei Wochen alt sind).
      - run: pip install --quiet pillow==12.3.0 numpy==2.2.6 tzdata==2026.4

      # Beitraege aus der Redaktion (/admin/, inhalte/beitraege/*.json) als Seiten einbauen,
      # News-Liste und Startseiten-Karten aktualisieren, danach das neue Design (/neu/) neu erzeugen.
      # Laeuft vor dem Instagram-Schritt, also ohne Secrets in der Umgebung.
      - name: Redaktionsbeitraege einbauen
        run: |
          python werkzeuge/beitraege.py _site
          python werkzeuge/suche.py index _site
          python _site/werkzeuge/neu_seiten.py
          rm -rf _site/werkzeuge/__pycache__

      # Werkzeugdateien nicht ausliefern (Abnahme 16.11.2026 H3): Skripte, Umzugs-/Hochlade-Anleitungen und
      # WordPress-Plugin-Quellen sind keine Seiten (auf Hetzner antwortete /neu-test/werkzeuge/*.py mit 500).
      # Liste gleich in werkzeuge/umzug.py (NICHT_AUSLIEFERN).
      - name: Werkzeugdateien entfernen
        run: |
          rm -rf _site/werkzeuge _site/wordpress-plugin
          rm -f _site/UMZUG.md _site/hochladen.ps1 _site/hochladen.bat _site/ANLEITUNG.txt _site/.gitignore _site/inhalte/LIESMICH.md

      - name: Instagram-Beitraege holen
        id: instagram
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_TOKEN_NACHWUCHS: ${{ secrets.IG_TOKEN_NACHWUCHS }}
          IG_ID: ${{ vars.IG_ID || secrets.IG_ID }}
          IG_ID_NACHWUCHS: ${{ vars.IG_ID_NACHWUCHS || secrets.IG_ID_NACHWUCHS }}
          IG_ERNEUERN: ${{ (github.event.schedule == '41 3 * * 1' || inputs.erneuern) && '1' || '0' }}
          IG_ZIEL: _site
        run: python .github/instagram.py

      # Hat nur ein Konto nicht geklappt (ig=neu), bleiben die Karten des anderen drin.
      - name: Bei Fehler ohne Instagram-Karten
        if: steps.instagram.outcome == 'failure' && steps.instagram.outputs.ig != 'neu'
        run: |
          rm -rf _site/assets/instagram
          cp instagram-daten.js _site/instagram-daten.js

      - name: Neuen Schluessel speichern
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          for name in IG_TOKEN IG_TOKEN_NACHWUCHS; do
            [ -f "$RUNNER_TEMP/$name" ] || continue
            if [ -z "$GH_TOKEN" ]; then echo "::warning::SECRETS_PAT fehlt, $name nicht gespeichert"; rm -f "$RUNNER_TEMP/$name"; continue; fi
            gh secret set "$name" --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/$name"
            rm -f "$RUNNER_TEMP/$name"
          done

      - name: Veroeffentlichen?
        id: entscheiden
        env:
          GH_TOKEN: ${{ github.token }}
          EREIGNIS: ${{ github.event_name }}
          IG_ERGEBNIS: ${{ steps.instagram.outcome }}
          IG: ${{ steps.instagram.outputs.ig }}
        run: |
          quelle=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type || echo unbekannt)
          adresse=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url || echo "")
          ja=0
          if [ "$quelle" != "workflow" ]; then
            echo "::notice::Pages-Quelle ist '$quelle', nicht GitHub Actions -- nur gebaut, nichts veroeffentlicht."
          elif [ "$EREIGNIS" != "schedule" ]; then
            ja=1
          elif [ "$IG_ERGEBNIS" != "success" ] || [ "$IG" != "neu" ]; then
            echo "Geplanter Lauf ohne neue Instagram-Daten -- die Seite bleibt, wie sie ist."
          elif curl -fsS "${adresse%/}/instagram-daten.js" -o "$RUNNER_TEMP/live.js" && cmp -s "$RUNNER_TEMP/live.js" _site/instagram-daten.js; then
            echo "Instagram-Beitraege unveraendert -- nichts zu veroeffentlichen."
          else
            ja=1
          fi
          echo "veroeffentlichen=$ja" >> "$GITHUB_OUTPUT"

      # Bei Push/per Hand immer hochladen (Beleg, dass das Artefakt baut), geplant nur zum Veroeffentlichen.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.entscheiden.outputs.veroeffentlichen == '1' || github.event_name != 'schedule'
        with:
          path: _site

      - id: deployment
        if: steps.entscheiden.outputs.veroeffentlichen == '1'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Test-Kopie auf dem Webspace bei Hetzner: www.sc1911-heiligenstadt.de/neu-test/ (UMZUG.md).
  # EIGENER Job (Bugjagd 16.11.2026 H2-1): Im Job "bauen" laufen Skripte aus dem Repo (werkzeuge/,
  # .github/instagram.py), die jeder mit Schreibrecht aendern kann -- ein geaendertes Skript koennte ueber
  # GITHUB_PATH/GITHUB_ENV spaetere Schritte unterwandern. Darum kommt HETZNER_SSH_KEY nur in diesen Job:
  # kein checkout, kein Repo-Code, nur das fertige Pages-Artefakt herunterladen, entpacken, rsync.
  # Das WordPress daneben bleibt unberuehrt; --delete wirkt nur im Ordner neu-test.
  # Tut nichts, solange das Secret HETZNER_SSH_KEY fehlt. Host-Schluessel fest eingetragen
  # (ssh-keyscan -p 222 dedi1977.your-server.de, 16.11.2026), kein blindes Vertrauen.
  # .htaccess bleibt draussen: ihre Weiterleitungen gelten erst fuer die echte Seite im Hauptordner.
  # Symlinks werden nicht mitgenommen (rsync ohne -l).
  # Seit dem Umzug (17.11.2026) ist der Hetzner-Webspace die echte Seite. Drei Jobs, damit der Server-Schluessel
  # NIE im selben Job wie Repo-Code steht (Bugjagd 16.11. H2-1/WS-1: Repo-Code koennte ihn sonst aus dem
  # Speicher des Runners lesen):
  #   hetzner-2025  Schluessel, KEIN Repo-Code: Beitraege aus 2025 vom Server (~/beitraege-2025) holen.
  #                 Sie liegen nicht im oeffentlichen Repo; als Artefakt (1 Tag) sind sie nicht oeffentlicher als
  #                 auf der Seite selbst, wo sie ohnehin stehen.
  #   live-bauen    Repo-Code, KEIN Schluessel: werkzeuge/umzug.py live (Repo + Redaktion + 2025er).
  #   hetzner       Schluessel, KEIN Repo-Code: fertige Seite nach public_html, .htaccess bleibt auf dem Server.
  hetzner-2025:
    needs: [bauen]
    if: needs.bauen.outputs.veroeffentlichen == '1'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Beitraege aus 2025 holen
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          if [ -z "$HETZNER_SSH_KEY" ]; then echo "::error::Kein HETZNER_SSH_KEY"; exit 1; fi
          install -m 600 /dev/null "$RUNNER_TEMP/hetzner"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$RUNNER_TEMP/hetzner"
          echo '[dedi1977.your-server.de]:222 ssh-rsa ' > "$RUNNER_TEMP/known_hosts"
          rsync -rt -e "ssh -p 222 -i $RUNNER_TEMP/hetzner -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"             "sccnld@dedi1977.your-server.de:beitraege-2025/" "$RUNNER_TEMP/b2025/"
          rm -f "$RUNNER_TEMP/hetzner"
          test -f "$RUNNER_TEMP/b2025/seiten/news.html" || { echo "::error::2025er unvollstaendig"; exit 1; }
          echo "$(find "$RUNNER_TEMP/b2025" -type f | wc -l) Dateien"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beitraege-2025
          path: ${{ runner.temp }}/b2025
          retention-days: 1
          if-no-files-found: error

  live-bauen:
    needs: [hetzner-2025]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: beitraege-2025
          path: ${{ github.workspace }}/../_umzug/beitraege-2025
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow==12.3.0 numpy==2.2.6 tzdata==2026.4
      - name: Echte Seite bauen
        run: |
          python werkzeuge/umzug.py live "$RUNNER_TEMP/seite"
          n=$(find "$RUNNER_TEMP/seite" -type f | wc -l)
          echo "$n Dateien"
          if [ "$n" -lt 3000 ]; then echo "::error::Nur $n Dateien gebaut"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seite-live
          path: ${{ runner.temp }}/seite
          retention-days: 1
          if-no-files-found: error

  hetzner:
    needs: [live-bauen]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seite-live
          path: ${{ runner.temp }}/seite
      - name: Echte Seite zu Hetzner
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          ZIEL: public_html/
        run: |
          if [ -z "$HETZNER_SSH_KEY" ]; then echo "::error::Kein HETZNER_SSH_KEY"; exit 1; fi
          n=$(find "$RUNNER_TEMP/seite" -type f | wc -l)
          echo "$n Dateien"
          if [ "$n" -lt 3000 ]; then echo "::error::Nur $n Dateien -- nichts hochgeladen"; exit 1; fi
          install -m 600 /dev/null "$RUNNER_TEMP/hetzner"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$RUNNER_TEMP/hetzner"
          echo '[dedi1977.your-server.de]:222 ssh-rsa ' > "$RUNNER_TEMP/known_hosts"
          rsync -rt --delete --exclude /.htaccess --exclude '/google*.html' --exclude /.well-known/             -e "ssh -p 222 -i $RUNNER_TEMP/hetzner -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"             "$RUNNER_TEMP/seite/" "sccnld@dedi1977.your-server.de:$ZIEL"
          rm -f "$RUNNER_TEMP/hetzner"
          echo "Live unter https://www.sc1911-heiligenstadt.de/"

  # Abnahme 07.10.2026 (AB3-6): GitHub schaltet Zeitplaene in oeffentlichen Repos nach 60 Tagen
  # ohne Repo-Aktivitaet ab -- und seit AB3-2 committet der Bot nichts mehr. Der Aufruf der
  # REST-Schnittstelle "Workflow aktivieren" setzt diesen 60-Tage-Zaehler zurueck, auch wenn der
  # Workflow noch aktiv ist (so machen es rust-lang und keepalive-workflow im API-Modus).
  # Woechentlich (Montagslauf) und per Hand reicht; ohne Commit, nur mit actions: write.
  wach-halten:
    if: github.event.schedule == '41 3 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/seite.yml/enable" && echo "Zeitplan aktiv gehalten."

  # Instagram-Fehler halten die Seite nicht auf, der Lauf wird aber rot (Mail von GitHub):
  # meist ist der Schluessel abgelaufen -- dann ist Handarbeit noetig.
  # NICHT rot wird es, wenn IG_TOKEN fehlt (instagram.py: "nichts zu tun", Seite ohne Karten)
  # oder wenn SECRETS_PAT fehlt (nur ::warning:: in "Neuen Schluessel speichern", der
  # verlaengerte Schluessel geht verloren; rot erst, wenn der alte nach 60 Tagen ablaeuft).
  instagram-fehler:
    needs: [bauen]
    if: always() && needs.bauen.outputs.instagram == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Instagram-Abruf fehlgeschlagen (Schluessel abgelaufen?). Die Seite laeuft ohne neue Instagram-Karten weiter."
          exit 1
