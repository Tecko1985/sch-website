# Abgleich der Spieltermine und Anstosszeiten (Bugjagd 28.11.2026: Startseite zeigte verlegte Spiele mit alter Zeit).
# 1. werkzeuge/termine.py: Termine-Seite (seiten/termine.html) und naechste Spiele der Mannschaftsseiten mit dem
#    Vereinsspielplan auf fussball.de (neue, weggefallene, verlegte Spiele, Zeit-/Ortsaenderungen, Absetzungen).
# 2. werkzeuge/spiele.py: Spielkarten "Aktuelle Spiele" der Startseite (index.html) mit FuPa (Anstosszeiten, Ergebnisse).
# Gestartet vom Zeitplan-Waechter (werkzeuge/zeitplan.py) alle 2 Stunden von 6 bis 22 Uhr; der cron ist nur
# Rueckfallebene, weil GitHub ihn oft stundenlang verschiebt.
# Nur wenn sich etwas geaendert hat: Commit auf main und danach "Seite bauen" anstossen (ein Push mit dem
# GITHUB_TOKEN startet keinen anderen Ablauf von selbst).
# Stoerung bei fussball.de (auffaellig wenige Spiele) oder FuPa (keine kommenden Spiele): der jeweilige Teil bleibt,
# wie er ist. Keine Secrets, keine Zusatzpakete (nur Python-Standardbibliothek).
name: Termine abgleichen

on:
  schedule:
    - cron: '23 4 * * *'   # Rueckfallebene; regelmaessig startet ihn der Zeitplan-Waechter
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: termine
  cancel-in-progress: false

jobs:
  abgleichen:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # geaenderte Termine-Seite committen
      actions: write    # danach "Seite bauen" starten
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Termine mit fussball.de abgleichen
        id: termine
        continue-on-error: true   # Stoerung bei fussball.de: Spielkarten trotzdem abgleichen
        env:
          TZ: Europe/Berlin
          TERMINE_BERICHT: ${{ runner.temp }}/bericht.txt
        run: python werkzeuge/termine.py

      - name: Spielkarten der Startseite mit FuPa abgleichen
        id: spiele
        continue-on-error: true
        env:
          TZ: Europe/Berlin
        run: python werkzeuge/spiele.py

      - name: Aenderungen speichern und Seite neu bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TERMINE="seiten/termine.html seiten/erste-mannschaft.html seiten/zweite-mannschaft.html"
          KARTEN="index.html assets/wappen"
          # Abgebrochene Teile nicht halb uebernehmen
          if [ "${{ steps.termine.outcome }}" != "success" ]; then git checkout -- $TERMINE; rm -f "$RUNNER_TEMP/bericht.txt"; fi
          if [ "${{ steps.spiele.outcome }}" != "success" ]; then git checkout -- $KARTEN; git clean -fdq -- assets/wappen; fi
          git add $TERMINE $KARTEN
          if git diff --cached --quiet; then
            echo "Keine Aenderungen an Terminen und Spielkarten."
            exit 0
          fi
          BERICHT="$RUNNER_TEMP/bericht.txt"
          if [ ! -s "$BERICHT" ]; then echo "Spielkarten der Startseite abgeglichen" > "$BERICHT"
          elif ! git diff --cached --quiet -- $KARTEN; then printf '\nSpielkarten der Startseite abgeglichen\n' >> "$BERICHT"; fi
          git config user.name "Termine-Abgleich"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -F "$BERICHT"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          gh workflow run seite.yml --ref main
          cat "$BERICHT" >> "$GITHUB_STEP_SUMMARY"
